<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Mis Tortas de Tiempo</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e9eefb;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:22px max(18px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #27304a}.brand{font-weight:800;font-size:21px}.brand span{color:#a78bfa}main{max-width:1050px;margin:auto;padding:30px 18px 70px}.muted{color:#9caac5}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:25px}h1{font-size:clamp(25px,4vw,36px);margin:0 0 8px}h2{margin:0 0 15px;font-size:20px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#8b5cf6;color:white;font-weight:700}.btn.secondary{background:#252d47;color:#e9eefb}.btn.danger{background:#54283c}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.panel{background:#151d32;border:1px solid #2a3550;border-radius:20px;padding:20px}.card{min-height:180px;text-align:left;color:inherit;display:flex;flex-direction:column;justify-content:space-between;gap:16px}.card:hover{border-color:#a78bfa}.mini{width:90px;height:90px;border-radius:50%;border:3px solid #303c5b}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px}.field label{color:#b9c5df;font-size:14px}input,select{background:#0c1428;color:#f4f6ff;border:1px solid #35425f;border-radius:10px;padding:12px;width:100%;min-width:0}input[type=color]{padding:4px;height:46px}.days{display:flex;gap:8px;flex-wrap:wrap}.day{border:1px solid #35425f;border-radius:10px;background:#101a2e;color:#dbe4fa;padding:10px 13px}.day.active{background:#6942c6;border-color:#a78bfa}.pie{width:min(100%,350px);aspect-ratio:1;display:block;margin:auto;transform:rotate(-90deg)}.pie path{stroke:#111a2c;stroke-width:1.1;cursor:pointer}.clock-wrap{position:relative;max-width:350px;margin:auto}.clock-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#111a2c;border-radius:50%;width:70px;height:70px;display:grid;place-content:center;text-align:center;font-weight:800;pointer-events:none}.legend{display:grid;gap:10px}.legend-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #2a3550}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:8px}.detail-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.slice-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid #35425f;border-radius:12px}.slice-row small{color:#a9b5cc}.empty{text-align:center;padding:55px 20px;border:1px dashed #425072;border-radius:20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.hint{font-size:13px;color:#aab7d1}.error{color:#ff9aab;font-size:14px}.title-input{font-size:17px}.divider{height:1px;background:#2a3550;margin:8px 0}@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}header{padding:18px}.card{padding:15px;min-height:160px}}@media(max-width:390px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini{width:65px;height:65px}.card{font-size:14px}}
</style></head><body><header><div class="brand">◷ Mis <span>Tortas</span></div><button class="btn secondary" onclick="goHome()">⌂ Inicio</button></header><main id="app"></main><script>
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];const KEY='mis-tortas-v1';let tortas=JSON.parse(localStorage.getItem(KEY)||'[]');let view='home',active=null,face='AM',draft=null,editIndex=-1,error='';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;const dur=m=>m%60?`${Math.floor(m/60)} h ${m%60} min`:`${m/60} h`;const save=()=>localStorage.setItem(KEY,JSON.stringify(tortas));const timeOpts=(selected)=>Array.from({length:49},(_,i)=>`<option value="${i*30}" ${i*30===selected?'selected':''}>${fmt(i*30)}${i===48?' (día siguiente)':''}</option>`).join('');function goHome(){view='home';render()}function startCreate(){draft={id:Date.now(),name:'',days:[],slices:[]};editIndex=-1;error='';view='edit';render()}function editTorta(){draft=JSON.parse(JSON.stringify(tortas[active]));editIndex=active;error='';view='edit';render()}function openTorta(i){active=i;face='AM';view='detail';render()}function toggleDay(i){draft.days=draft.days.includes(i)?draft.days.filter(x=>x!==i):[...draft.days,i].sort();render()}function readDraft(){draft.name=document.getElementById('name').value.trim()}function addSlice(){readDraft();let title=document.getElementById('slice-title').value.trim(),start=+document.getElementById('start').value,end=+document.getElementById('end').value,color=document.getElementById('color').value;if(!title){error='Escribe el nombre de la actividad.';render();return}if(end<=start){error='La hora final debe ser posterior a la inicial.';render();return}if(draft.slices.some(s=>start<s.end&&end>s.start)){error='Ese horario se superpone con otro trozo. Modifica las horas.';render();return}draft.slices.push({title,start,end,color});draft.slices.sort((a,b)=>a.start-b.start);error='';render()}function removeSlice(i){readDraft();draft.slices.splice(i,1);render()}function saveTorta(){readDraft();if(!draft.name||!draft.days.length){error='Agrega un nombre y selecciona al menos un día.';render();return}if(editIndex>=0)tortas[editIndex]=draft;else tortas.push(draft);save();goHome()}function deleteTorta(){if(confirm('¿Eliminar esta torta y todos sus trozos?')){tortas.splice(active,1);save();goHome()}}function polar(a,r){return [100+r*Math.sin(a),100-r*Math.cos(a)]}function wedge(start,end){let a=start/720*Math.PI*2,b=end/720*Math.PI*2;let [x1,y1]=polar(a,98),[x2,y2]=polar(b,98);return `M100 100 L${x1} ${y1} A98 98 0 ${b-a>Math.PI?1:0} 1 ${x2} ${y2} Z`}function pie(slices,side){let offset=side==='AM'?0:720;let visible=slices.flatMap(s=>{let a=Math.max(offset,s.start),b=Math.min(offset+720,s.end);return b>a?[{...s,a:a-offset,b:b-offset}]:[]});let ticks=Array.from({length:12},(_,i)=>{let [x,y]=polar(i*Math.PI/6,98),[x2,y2]=polar(i*Math.PI/6,87);return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#465473" stroke-width="1"/>`}).join('');return `<div class="clock-wrap"><svg class="pie" viewBox="0 0 200 200" style="transform:none" aria-label="Reloj de 12 horas ${side}"><circle cx="100" cy="100" r="98" fill="#263249"/>${visible.map(s=>`<path d="${wedge(s.a,s.b)}" fill="${esc(s.color)}"><title>${esc(s.title)} · ${fmt(s.start)}–${fmt(s.end)}</title></path>`).join('')}${ticks}<circle cx="100" cy="100" r="98" fill="none" stroke="#667798" stroke-width="1.5"/></svg><div class="clock-label">${side}<span style="font-size:11px;color:#aab7d1">12 horas</span></div></div>`}function totals(slices){let m=new Map();for(let s of slices){let k=s.title.trim().toLocaleLowerCase('es');if(!m.has(k))m.set(k,{title:s.title,color:s.color,total:0});m.get(k).total+=s.end-s.start}return [...m.values()]}function render(){if(view==='home'){app.innerHTML=`<div class="top"><div><h1>Mis tortas de tiempo</h1><div class="muted">Organiza tus días en porciones de 30 minutos.</div></div><button class="btn" onclick="startCreate()">＋ Crear torta</button></div>${tortas.length?`<div class="cards">${tortas.map((t,i)=>`<button class="card" onclick="openTorta(${i})"><div><strong>${esc(t.name)}</strong><div class="muted" style="font-size:12px;margin-top:6px">${t.days.map(d=>DAYS[d]).join(', ')}</div></div><div class="mini" style="background:${gradient(t.slices)}"></div><small class="muted">${t.slices.length} trozos · Ver detalle →</small></button>`).join('')}</div>`:`<div class="empty"><h2>Aún no tienes tortas</h2><p class="muted">Crea tu primer horario y empieza a visualizar cómo distribuyes tus 24 horas.</p><button class="btn" onclick="startCreate()">Crear mi primera torta</button></div>`}`;return}if(view==='edit'){app.innerHTML=`<div class="top"><div><h1>${editIndex>=0?'Editar torta':'Crear nueva torta'}</h1><div class="muted">Define los días y agrega las actividades.</div></div><button class="btn secondary" onclick="goHome()">Cancelar</button></div><div class="stack"><section class="panel stack"><h2>1. Datos de la torta</h2><div class="field"><label for="name">Nombre de la torta</label><input id="name" class="title-input" placeholder="Ej. Lunes a viernes" value="${esc(draft.name)}" oninput="draft.name=this.value"></div><div class="field"><label>Días que representa (puedes seleccionar uno o varios)</label><div class="days">${DAYS.map((d,i)=>`<button class="day ${draft.days.includes(i)?'active':''}" onclick="toggleDay(${i})">${d}</button>`).join('')}</div></div></section><section class="panel stack"><h2>2. Crear trozo de torta</h2><div class="fields"><div class="field"><label for="slice-title">Título de actividad</label><input id="slice-title" placeholder="Ej. Dormir, trabajar..."></div><div class="field"><label for="color">Color</label><input id="color" type="color" value="#8b5cf6"></div><div class="field"><label for="start">Desde</label><select id="start">${timeOpts(0)}</select></div><div class="field"><label for="end">Hasta</label><select id="end">${timeOpts(420)}</select></div></div><div class="hint">00:00–12:00 corresponde a AM; 12:00–24:00 a PM. Si una actividad cruza las 12:00, se dibuja automáticamente en ambas caras.</div><button class="btn" onclick="addSlice()">＋ Agregar trozo</button>${error?`<div class="error">${esc(error)}</div>`:''}</section><section class="panel stack"><h2>3. Trozos agregados (${draft.slices.length})</h2>${draft.slices.length?draft.slices.map((s,i)=>`<div class="slice-row"><div><span class="dot" style="background:${esc(s.color)}"></span><strong>${esc(s.title)}</strong><div><small>${fmt(s.start)} a ${fmt(s.end)} · ${dur(s.end-s.start)}</small></div></div><button class="btn danger" onclick="removeSlice(${i})">Quitar</button></div>`).join(''):'<p class="muted">Todavía no has agregado actividades.</p>'}</section><div class="actions"><button class="btn" onclick="saveTorta()">Guardar torta</button><button class="btn secondary" onclick="goHome()">Volver</button></div></div>`;return}let t=tortas[active];let sum=totals(t.slices);app.innerHTML=`<div class="top"><div><button class="btn secondary" style="margin-bottom:14px" onclick="goHome()">← Mis tortas</button><h1>${esc(t.name)}</h1><div class="muted">${t.days.map(d=>DAYS[d]).join(' · ')}</div></div><div class="actions"><button class="btn secondary" onclick="editTorta()">✎ Editar</button><button class="btn danger" onclick="deleteTorta()">Eliminar</button></div></div><div class="detail-layout"><section class="panel stack"><div class="top" style="margin:0"><h2>Reloj ${face}</h2><button class="btn" onclick="face=face==='AM'?'PM':'AM';render()">↻ Girar a ${face==='AM'?'PM':'AM'}</button></div>${pie(t.slices,face)}<p class="hint" style="text-align:center">12 arriba · 3 derecha · 6 abajo · 9 izquierda</p></section><section class="panel"><h2>Resumen de tus 24 horas</h2><div class="legend">${sum.map(s=>`<div class="legend-item"><span><span class="dot" style="background:${esc(s.color)}"></span>${esc(s.title)}</span><strong>${dur(s.total)}</strong></div>`).join('')||'<p class="muted">Sin actividades aún.</p>'}<div class="legend-item"><span class="muted">Tiempo asignado</span><strong>${dur(t.slices.reduce((n,s)=>n+s.end-s.start,0))}</strong></div><div class="legend-item"><span class="muted">Tiempo libre / sin asignar</span><strong>${dur(1440-t.slices.reduce((n,s)=>n+s.end-s.start,0))}</strong></div></div><div class="divider"></div><h2 style="margin-top:22px">Horarios</h2><div class="legend">${t.slices.map(s=>`<div class="legend-item"><span><span class="dot" style="background:${esc(s.color)}"></span>${esc(s.title)}</span><span>${fmt(s.start)}–${fmt(s.end)}</span></div>`).join('')}</div></section></div>`}function gradient(slices){let parts=[],last=0;for(let s of slices){if(s.start>last)parts.push(`#263249 ${last/1440*100}% ${s.start/1440*100}%`);parts.push(`${s.color} ${s.start/1440*100}% ${s.end/1440*100}%`);last=s.end}if(last<1440)parts.push(`#263249 ${last/1440*100}% 100%`);return `conic-gradient(${parts.join(',')||'#263249 0% 100%'})`}render();
</script></body></html>
