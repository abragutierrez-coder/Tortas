<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>Mi Tiempo — Reloj de rutinas</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9edf7;background:#0b1020;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1040px;margin:auto;padding:22px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850;letter-spacing:-.6px}.brandmark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:conic-gradient(#a78bfa 0 32%,#34d399 32% 65%,#fbbf24 65% 100%);color:#101426;font-size:19px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#9da9c5;font-weight:750}h1{font-size:clamp(27px,5vw,39px);margin:8px 0 9px;letter-spacing:-1.2px}h2{font-size:20px;letter-spacing:-.5px;margin:0}p{color:#9eabc6;line-height:1.55;margin:0}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:750;color:#ecedff;background:#28324a;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px}.btn.primary{background:#a78bfa;color:#181126}.btn.ghost{background:#1b253b}.btn.danger{background:#44283b;color:#ffb5c6}.btn.small{padding:9px 12px;min-height:38px;font-size:13px}.btn.full{width:100%}.muted{color:#9ba7c2}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.schedule-card{border:1px solid #303c57;background:#171f33;border-radius:18px;padding:17px 12px;text-align:left;color:#eef1fb;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;transition:transform .2s,border-color .2s}.schedule-card:hover{transform:translateY(-2px);border-color:#a78bfa}.schedule-card strong{font-size:16px;overflow-wrap:anywhere}.schedule-card small{color:#98a6c2;font-size:12px}.mini{width:52px;height:52px;border-radius:50%;position:relative;background:conic-gradient(#818cf8 0 28%,#34d399 28% 62%,#fbbf24 62% 78%,#fb7185 78%)}.mini:after{content:'';position:absolute;inset:17px;background:#171f33;border-radius:50%}.empty{border:1px dashed #495473;border-radius:22px;padding:65px 18px;text-align:center;display:grid;justify-items:center;gap:14px;margin-top:20px}.empty .icon{font-size:46px}.panel{background:#151e31;border:1px solid #2b3650;border-radius:22px;padding:19px}.editor-grid,.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}.field label,.field-label{font-size:13px;font-weight:750;color:#cdd5e8}input,select{width:100%;background:#0e172a;border:1px solid #3a4764;border-radius:12px;color:#f1f4fc;padding:12px;min-height:46px;outline:none}input:focus,select:focus{border-color:#a78bfa}input[type=color]{width:57px;min-width:57px;padding:4px;cursor:pointer}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:9px}.day{border:1px solid #38445f;background:#101a2d;border-radius:10px;padding:12px 2px;color:#b8c4dd;font-weight:700;font-size:12px}.day.active{background:#a78bfa;border-color:#a78bfa;color:#171327}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.activity{border:1px solid #34415d;background:#101a2c;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:9px}.dot{width:12px;height:12px;border-radius:50%;flex:none}.activity-info{min-width:0;flex:1}.activity-info strong{font-size:14px;display:block;overflow-wrap:anywhere}.activity-info small{font-size:12px;color:#9ba9c4}.icon-btn{border:0;background:#2b354b;color:#e9ecf5;border-radius:10px;width:36px;height:36px;font-size:17px;flex:none}.note{font-size:12px;color:#a8b5d0;line-height:1.5}.alert{background:#442c37;color:#ffd2dc;border-radius:12px;padding:12px;font-size:13px;margin-top:12px}.success{background:#193c37;color:#baf2d9}.chart-wrap{position:relative;max-width:440px;margin:0 auto}.chart-wrap svg{width:100%;display:block;overflow:visible;touch-action:manipulation}.sector{cursor:pointer;transition:filter .15s}.sector:focus,.sector:hover{filter:brightness(1.12);outline:none}.sector-label{pointer-events:none;fill:#111827;font-weight:800;font-size:11px;paint-order:stroke;stroke:#ffffff66;stroke-width:2px;stroke-linejoin:round}.tick{fill:#b8c5dc;font-size:12px;font-weight:750}.tooltip{position:absolute;z-index:4;min-width:150px;max-width:210px;pointer-events:none;background:#f4f2ff;color:#171a29;padding:11px 13px;border-radius:13px;box-shadow:0 12px 30px #0009;transform:translate(-50%,-115%);font-size:12px;line-height:1.5}.tooltip strong{font-size:14px;display:block}.segmented{display:flex;background:#0c1527;border:1px solid #34415b;border-radius:14px;padding:5px;gap:4px}.segmented button{flex:1;background:transparent;border:0;border-radius:10px;color:#a7b3cb;padding:10px;font-weight:800}.segmented button.active{background:#a78bfa;color:#1c142d}.legend{display:grid;gap:10px;margin-top:18px}.legend-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#101a2d;padding:12px;border-radius:12px}.legend-item .row{min-width:0}.legend-item strong{font-size:14px;overflow-wrap:anywhere}.legend-item span{font-weight:750;font-size:13px;white-space:nowrap}.back{margin-bottom:15px}.foot-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}.hint{font-size:12px;color:#8f9db9;text-align:center;margin-top:10px}.count{font-size:13px;color:#a5b2cc}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f0edff;color:#17142a;border-radius:12px;padding:12px 18px;z-index:9;box-shadow:0 12px 40px #0009;font-size:13px;max-width:90vw}.hidden{display:none!important}@media(max-width:700px){.app{padding:17px 13px 75px}.top{margin-bottom:22px}.editor-grid,.detail-grid{grid-template-columns:1fr}.cards{gap:8px}.schedule-card{padding:12px 9px;min-height:133px;border-radius:14px}.schedule-card strong{font-size:13px}.schedule-card small{font-size:10px}.mini{width:40px;height:40px}.mini:after{inset:13px}.panel{padding:14px}.btn{font-size:13px;padding:12px}.top .btn{font-size:12px}.day{font-size:11px;padding:11px 0}.detail-grid{gap:12px}}@media(max-width:360px){.brand{font-size:17px}.top .btn{padding:9px}.day{font-size:10px}}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand"><div class="brandmark">◷</div>Mi Tiempo</div><button class="btn small ghost" id="headerBtn">+ Nueva torta</button></header><div id="screen"></div></main><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];const KEY='mi-tiempo-v1';const PALETTE=['#818cf8','#34d399','#fbbf24','#fb923c','#f472b6','#38bdf8','#c084fc','#f87171'];let schedules=[];try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(parsed))schedules=parsed}catch{}let view='home',editing=null,selected=null,side='AM',tooltip=null,formDays=[0,1,2,3,4],draft=[],editingPiece=-1;const root=document.getElementById('screen');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const fmt=t=>`${String(Math.floor(t/60)%24).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;const duration=a=>{const h=Math.floor(a/60),m=a%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} h`};const times=()=>Array.from({length:49},(_,i)=>`<option value="${i*30}">${fmt(i*30)}</option>`).join('');const total=p=>p.end-p.start;function persist(){try{localStorage.setItem(KEY,JSON.stringify(schedules))}catch{notify('No se pudo guardar: almacenamiento bloqueado')}}function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),3200)}function go(v){view=v;tooltip=null;render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('headerBtn').onclick=()=>newSchedule();function newSchedule(s=null){editing=s?.id||null;selected=s?.id||null;formDays=s?[...s.days]:[0,1,2,3,4];draft=s?s.pieces.map(p=>({...p})):[];editingPiece=-1;go('editor')}
function render(){document.getElementById('headerBtn').classList.toggle('hidden',view==='editor');if(view==='home')home();else if(view==='editor')editor();else detail()}
function home(){root.innerHTML=`<div class="eyebrow">Organiza tu vida visualmente</div><h1>Tus días, en equilibrio.</h1><p>Crea relojes de 24 horas y descubre cómo distribuyes tu tiempo.</p><div class="section-head"><h2>Mis tortas</h2><span class="count">${schedules.length} creadas</span></div>${schedules.length?`<div class="cards">${schedules.map(s=>`<button class="schedule-card" data-open="${esc(s.id)}"><div class="mini" style="background:${miniGradient(s.pieces)}"></div><div><strong>${esc(s.name)}</strong><br><small>${s.days.map(i=>DAYS[i]?.slice(0,3)).join(' · ')||'Personalizada'}</small></div></button>`).join('')}</div>`:`<div class="empty"><div class="icon">◷</div><h2>Tu primera torta te espera</h2><p>Agrega tus actividades para ver cómo se reparten tus 24 horas.</p><button class="btn primary" id="first">+ Crear mi primera torta</button></div>`}`;root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;side='AM';go('detail')});const first=document.getElementById('first');if(first)first.onclick=()=>newSchedule()}
function miniGradient(p){if(!p.length)return 'conic-gradient(#29344b 0 100%)';const colors=p.slice(0,6).map((x,i)=>`${x.color} ${i*100/Math.min(p.length,6)}% ${(i+1)*100/Math.min(p.length,6)}%`);return `conic-gradient(${colors.join(',')})`}
function editor(){const s=schedules.find(s=>s.id===editing);root.innerHTML=`<button class="btn ghost small back" id="back">← Volver</button><div class="eyebrow">${editing?'Editar horario':'Nuevo horario'}</div><h1>${editing?'Editar tu torta':'Crea tu torta'}</h1><p>Elige los días y añade actividades de 30 en 30 minutos.</p><div class="editor-grid"><section class="panel"><h2>01 · Datos de la torta</h2><div class="field"><label for="name">Nombre de la torta</label><input id="name" maxlength="45" placeholder="Ej. Lunes a viernes" value="${esc(s?.name||'')}"></div><div class="field"><span class="field-label">¿Qué días representa?</span><div class="days">${DAYS.map((d,i)=>`<button type="button" class="day ${formDays.includes(i)?'active':''}" data-day="${i}" aria-pressed="${formDays.includes(i)}">${d.slice(0,3)}</button>`).join('')}</div></div><div class="row wrap"><button class="btn ghost small" id="week">Lun–Vie</button><button class="btn ghost small" id="all">Toda la semana</button><button class="btn ghost small" id="none">Limpiar</button></div><div class="foot-actions"><button class="btn primary full" id="save">Guardar torta ✓</button></div><p class="note" style="margin-top:12px">Se guarda en este navegador. Puedes editarla cuando quieras.</p></section><section class="panel"><div class="row between"><h2>02 · Trozos de torta</h2><span class="count" id="pieceCount"></span></div><div class="field"><label for="pieceName">Actividad</label><input id="pieceName" maxlength="45" placeholder="Ej. Dormir"></div><div class="two"><div class="field"><label for="start">Desde</label><select id="start">${times()}</select></div><div class="field"><label for="end">Hasta</label><select id="end">${times()}</select></div></div><div class="row between"><label class="field-label" for="color">Color de actividad</label><input type="color" id="color" value="${PALETTE[draft.length%PALETTE.length]}"></div><div class="foot-actions"><button class="btn primary full" id="add">+ Agregar trozo</button></div><div id="error"></div><div id="pieceList" style="margin-top:16px"></div></section></div>`;document.getElementById('back').onclick=()=>go(editing?'detail':'home');root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.day);formDays=formDays.includes(n)?formDays.filter(x=>x!==n):[...formDays,n].sort();b.classList.toggle('active');b.setAttribute('aria-pressed',String(formDays.includes(n)))});document.getElementById('week').onclick=()=>setDays([0,1,2,3,4]);document.getElementById('all').onclick=()=>setDays([0,1,2,3,4,5,6]);document.getElementById('none').onclick=()=>setDays([]);document.getElementById('start').value='0';document.getElementById('end').value='420';document.getElementById('add').onclick=addPiece;document.getElementById('save').onclick=save;renderPieces()}
function setDays(a){formDays=a;root.querySelectorAll('[data-day]').forEach(b=>{const yes=a.includes(Number(b.dataset.day));b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))})}
function renderPieces(){document.getElementById('pieceCount').textContent=`${draft.length} trozos`;document.getElementById('pieceList').innerHTML=draft.length?draft.map((p,i)=>`<div class="activity"><div class="dot" style="background:${esc(p.color)}"></div><div class="activity-info"><strong>${esc(p.name)}</strong><small>${fmt(p.start)}–${fmt(p.end)} · ${duration(total(p))}</small></div><button class="icon-btn" data-edit="${i}" title="Editar" aria-label="Editar ${esc(p.name)}">✎</button><button class="icon-btn" data-remove="${i}" title="Eliminar" aria-label="Eliminar ${esc(p.name)}">×</button></div>`).join(''):'<p class="note" style="margin-top:14px">Aún no hay trozos. Agrega el primero arriba.</p>';root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.splice(Number(b.dataset.remove),1);editingPiece=-1;renderPieces()});root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editingPiece=Number(b.dataset.edit);const p=draft[editingPiece];document.getElementById('pieceName').value=p.name;document.getElementById('start').value=p.start;document.getElementById('end').value=p.end;document.getElementById('color').value=p.color;document.getElementById('add').textContent='✓ Actualizar trozo';document.getElementById('pieceName').focus()})}
function addPiece(){const name=document.getElementById('pieceName').value.trim(),start=+document.getElementById('start').value,end=+document.getElementById('end').value,color=document.getElementById('color').value;const err=document.getElementById('error');let msg='';if(!name)msg='Escribe el nombre de la actividad.';else if(end<=start)msg='La hora final debe ser posterior a la inicial. Para cruzar medianoche, crea un trozo hasta 24:00 y otro desde 00:00.';else if(draft.some((p,i)=>i!==editingPiece&&start<p.end&&end>p.start))msg='Este horario se superpone con otro trozo. Modifica las horas.';if(msg){err.innerHTML=`<div class="alert">${esc(msg)}</div>`;return}err.innerHTML='';const piece={name,start,end,color};if(editingPiece>=0)draft[editingPiece]=piece;else draft.push(piece);draft.sort((a,b)=>a.start-b.start);editingPiece=-1;document.getElementById('pieceName').value='';document.getElementById('color').value=PALETTE[draft.length%PALETTE.length];document.getElementById('add').textContent='+ Agregar trozo';renderPieces();notify('Trozo guardado')}
function save(){const name=document.getElementById('name').value.trim();if(!name){notify('Escribe un nombre para la torta');document.getElementById('name').focus();return}if(!formDays.length){notify('Selecciona al menos un día');return}if(!draft.length){notify('Agrega al menos un trozo');return}const item={id:editing||id(),name,days:[...formDays],pieces:draft.map(p=>({...p}))};const i=schedules.findIndex(s=>s.id===item.id);if(i<0)schedules.push(item);else schedules[i]=item;persist();selected=item.id;notify('Torta guardada');go('home')}
const pt=(angle,r)=>({x:160+r*Math.sin(angle*Math.PI/180),y:160-r*Math.cos(angle*Math.PI/180)});function wedge(a,b){const p=pt(a/720*360,121),q=pt(b/720*360,121);if(b-a>=720)return 'M 160 39 A 121 121 0 1 1 159.999 39 Z';return `M160 160 L${p.x.toFixed(3)} ${p.y.toFixed(3)} A121 121 0 ${b-a>360?1:0} 1 ${q.x.toFixed(3)} ${q.y.toFixed(3)} Z`}
function chart(pieces){const base=side==='AM'?0:720;let svg=`<svg viewBox="0 0 320 320" role="img" aria-label="Reloj de actividades ${side}"><circle cx="160" cy="160" r="121" fill="#26334a"/>`;const visible=pieces.map((p,i)=>({...p,i,a:Math.max(base,p.start)-base,b:Math.min(base+720,p.end)-base})).filter(p=>p.b>p.a);for(const p of visible){svg+=`<path class="sector" tabindex="0" role="button" aria-label="${esc(p.name)} ${fmt(p.start)} a ${fmt(p.end)}" data-sector="${p.i}" d="${wedge(p.a,p.b)}" fill="${esc(p.color)}" stroke="#111827" stroke-width="2"/>`;const span=p.b-p.a;const center=pt((p.a+p.b)/2/720*360,span>=150?79:91);if(span>=75){const max=span>=150?15:10;let label=p.name.length>max?p.name.slice(0,max-1)+'…':p.name;svg+=`<text class="sector-label" x="${center.x.toFixed(2)}" y="${center.y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle">${esc(label)}</text>`}}for(let i=0;i<12;i++){const pos=pt(i*30,143);svg+=`<text class="tick" x="${pos.x.toFixed(2)}" y="${(pos.y+4).toFixed(2)}" text-anchor="middle">${i===0?12:i}</text>`}svg+=`<circle cx="160" cy="160" r="30" fill="#111827"/><text x="160" y="166" fill="#f7f5ff" font-size="19" font-weight="850" text-anchor="middle">${side}</text></svg>`;return svg}
function detail(){const s=schedules.find(x=>x.id===selected);if(!s){go('home');return}const totals=new Map();s.pieces.forEach(p=>{const k=p.name.trim().toLocaleLowerCase('es');if(!totals.has(k))totals.set(k,{name:p.name,color:p.color,minutes:0});totals.get(k).minutes+=total(p)});const used=s.pieces.reduce((a,p)=>a+total(p),0);root.innerHTML=`<button class="btn ghost small back" id="back">← Mis tortas</button><div class="eyebrow">${s.days.map(i=>DAYS[i]).join(' · ')}</div><h1>${esc(s.name)}</h1><p>Explora tu día, actividad por actividad.</p><div class="detail-grid"><section class="panel"><div class="row between" style="margin-bottom:18px"><h2>Tu reloj</h2><span class="count">12 horas por cara</span></div><div class="segmented"><button data-side="AM" class="${side==='AM'?'active':''}">☀ AM</button><button data-side="PM" class="${side==='PM'?'active':''}">☾ PM</button></div><div class="chart-wrap" id="chart">${chart(s.pieces)}<div class="tooltip hidden" id="tip"></div></div><button class="btn full ghost" id="flip">↻ Girar a ${side==='AM'?'PM':'AM'}</button><p class="hint">Toca un color para ver su actividad y duración.</p></section><section class="panel"><div class="row between"><h2>Resumen de 24 horas</h2><span class="count">${duration(used)} ocupadas</span></div><div class="legend">${[...totals.values()].map(p=>`<div class="legend-item"><div class="row"><div class="dot" style="background:${esc(p.color)}"></div><strong>${esc(p.name)}</strong></div><span>${duration(p.minutes)}</span></div>`).join('')}${used<1440?`<div class="legend-item"><div class="row"><div class="dot" style="background:#26334a"></div><strong>Sin asignar</strong></div><span>${duration(1440-used)}</span></div>`:''}</div><div class="foot-actions"><button class="btn primary" id="edit">✎ Editar torta</button><button class="btn danger" id="delete">Eliminar</button></div><p class="note" style="margin-top:18px">Las actividades con el mismo nombre se suman aunque estén repartidas entre AM y PM.</p></section></div>`;document.getElementById('back').onclick=()=>go('home');root.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;detail()});document.getElementById('flip').onclick=()=>{side=side==='AM'?'PM':'AM';detail()};document.getElementById('edit').onclick=()=>newSchedule(s);document.getElementById('delete').onclick=()=>{if(confirm(`¿Eliminar la torta "${s.name}"?`)){schedules=schedules.filter(x=>x.id!==s.id);persist();notify('Torta eliminada');go('home')}};const area=document.getElementById('chart'),tip=document.getElementById('tip');function show(e){const path=e.target.closest('[data-sector]');if(!path){tip.classList.add('hidden');return}const p=s.pieces[Number(path.dataset.sector)],rect=area.getBoundingClientRect(),box=path.getBoundingClientRect();let x=e.clientX??(box.left+box.width/2),y=e.clientY??(box.top+box.height/2);x=Math.max(rect.left+90,Math.min(rect.right-90,x));y=Math.max(rect.top+70,Math.min(rect.bottom,y));tip.style.left=`${x-rect.left}px`;tip.style.top=`${y-rect.top}px`;tip.innerHTML=`<strong>${esc(p.name)}</strong>${fmt(p.start)}–${fmt(p.end)}<br>${duration(total(p))}`;tip.classList.remove('hidden')}area.addEventListener('click',show);area.querySelectorAll('[data-sector]').forEach(p=>p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show({target:p})}}));document.addEventListener('click',function dismiss(e){if(!document.body.contains(area)){document.removeEventListener('click',dismiss);return}if(!area.contains(e.target))tip.classList.add('hidden')})}
render();
})();
</script></body></html>
